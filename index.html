<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultor de precios y stock – Top Neumáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1d1f; --ground:#f2f0eb; --card:#ffffff; --line:#d9d5cc; --field:#b8b3a8;
    --muted:#5b5750; --accent:#c2410c; --accent-dk:#9a3412; --live:#1d4ed8; --soft:#ece9e2;
    --display:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#dedad2;color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  .app{max-width:760px;min-height:100vh;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
  header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:12px}
  .brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px}
  .sub{font-size:13px;color:#d6d3cc}
  .search{display:flex;gap:8px}
  .search input{flex:1;min-width:0;height:54px;border:none;border-radius:10px;padding:0 14px;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink)}
  .search input::placeholder{font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#8a857b}
  button{font-family:var(--body);cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn{border:none;border-radius:10px;font-size:15px;font-weight:600;min-height:54px;padding:0 20px;background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-dk)}
  input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--live);outline-offset:2px}
  .opts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#d6d3cc}
  .opts label{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
  .opts input{width:20px;height:20px;accent-color:var(--accent)}

  main{padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px}
  .status{font-size:14px;color:var(--muted);padding:0 4px}
  .err{background:#fff;border:2px solid var(--accent-dk);border-radius:12px;padding:14px 16px;color:var(--accent-dk);font-weight:600;font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;line-height:1.5}

  details.prod{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  details.prod[open]{border-color:var(--ink)}
  summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:16px;font-weight:600;line-height:1.3}
  .pmeta{font-size:12px;color:var(--muted);margin-top:4px}
  .pstock{text-align:right;flex-shrink:0}
  .pstock b{display:block;font-family:var(--display);font-size:28px;line-height:1}
  .pstock small{font-size:11px;color:var(--muted)}
  .pstock.zero b{color:var(--accent-dk)}
  .chev{width:20px;height:20px;flex-shrink:0;margin-top:2px;transition:transform .15s}
  details[open] .chev{transform:rotate(180deg)}

  .pbody{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
  .sect{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--soft);border-radius:20px;padding:6px 12px;font-size:13px}
  .chip b{font-weight:600}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.num,td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
  td.lista b{font-weight:600}
  td.lista small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  td.big{font-weight:600}
  tr:last-child td{border-bottom:none}
  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #5b5750;background:transparent;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
  .cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .principal{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .principal .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .principal .val{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent-dk);line-height:1}
  .principal .alt{font-size:12px;color:var(--muted)}
  tr.grp td{background:var(--soft);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px}
  .demo{background:var(--accent-dk);color:#fff;font-size:12px;text-align:center;padding:4px}
  .foot-note{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="demo" id="demoBar" style="display:none">Modo demo: sin conexión a Odoo</div>
  <header>
    <div>
      <div class="brand">TOP · Consultor de precios</div>
      <div class="sub">Precio por lista y stock por depósito, en vivo desde Odoo</div>
    </div>
    <div class="search">
      <input id="q" placeholder="Medida o nombre: 205 55 16, F600…" autocomplete="off" enterkeyhint="search" aria-label="Buscar producto" onkeydown="if(event.key==='Enter')buscar()">
      <button class="btn" id="btnBuscar" onclick="buscar()">Buscar</button>
    </div>
    <div class="cats" role="group" aria-label="Tipo de cliente" id="cats"></div>
    <div class="opts">
      <label><input type="checkbox" id="soloStock" onchange="render()"> Solo con stock</label>
      <label><input type="checkbox" id="conIva" checked onchange="render()"> Mostrar con IVA</label>
    </div>
  </header>

  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="err" id="err" style="display:none"></div>
    <div id="results"></div>
    <div class="empty" id="empty">Escribí una medida o parte del nombre y tocá Buscar.<br>Ejemplos: <b>205 55 16</b>, <b>175/70R13</b>, <b>F600</b>.</div>
  </main>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN
   WEBHOOK_URL vacío = modo demo (no llama a n8n).
   ===================================================================== */
const CONFIG = {
  WEBHOOK_URL: 'https://envy-recollect-last.ngrok-free.dev/webhook/consulta-precios',
  HEADER_NAME: 'X-CP-Key'     // mismo nombre que la credencial Header Auth del Webhook
};
const DEMO = !CONFIG.WEBHOOK_URL;

let data = null;
const CATS_BASE = ['Todas', 'Mostrador', 'Distribución', 'Reventa', 'Reventa afiliado', 'Empresa afiliado'];
let cat = 'Todas';
try { cat = localStorage.getItem('cp_cat') || 'Todas'; } catch(e){}

function renderCats(){
  const extra = data && data.productos.some(p => p.precios.some(x => x.categoria === 'Otras')) ? ['Otras'] : [];
  const lista = [...CATS_BASE, ...extra];
  if(!lista.includes(cat)) cat = 'Todas';
  document.getElementById('cats').innerHTML = lista.map(c =>
    `<button aria-pressed="${c === cat}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){
  cat = c;
  try { localStorage.setItem('cp_cat', c); } catch(e){}
  renderCats(); render();
}

/* ---------- API ---------- */
function getKey(){
  let k = null;
  try { k = localStorage.getItem('cp_key'); } catch(e){}
  if(!k){
    k = window.prompt('Clave de acceso (la da el administrador):');
    if(!k) throw new Error('Falta la clave de acceso.');
    if(window.confirm('¿Recordar la clave en este dispositivo?')){ try{ localStorage.setItem('cp_key', k); }catch(e){} }
  }
  return k;
}
async function api(payload){
  const key = getKey();
  const r = await fetch(CONFIG.WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', [CONFIG.HEADER_NAME]: key, 'ngrok-skip-browser-warning': '1' },
    body: JSON.stringify(payload)
  });
  if(r.status === 401 || r.status === 403){ try{ localStorage.removeItem('cp_key'); }catch(e){} throw new Error('Clave incorrecta. Volvé a intentar.'); }
  const txt = await r.text();
  if(!r.ok) throw new Error('Error del servidor (' + r.status + '): ' + (txt || 'sin detalle') + '. Revisá Executions en n8n.');
  if(!txt) throw new Error('n8n respondió vacío. Revisá Executions en n8n.');
  try { return JSON.parse(txt); } catch(e){ throw new Error('Respuesta no válida de n8n: ' + txt.slice(0, 120)); }
}

function demoData(q){
  const precios = base => [
    { lista: 'MP 6 / Mi Pyme 6 C / Bco Ctes 6C', categoria: 'Mostrador', moneda: 'ARS', sin_iva: base * 1.12, con_iva: base * 1.12 * 1.21, regla: '+12% sobre Contado' },
    { lista: 'MP 12', categoria: 'Mostrador', moneda: 'ARS', sin_iva: base * 1.25, con_iva: base * 1.25 * 1.21, regla: '+25% sobre Contado' },
    { lista: '0-30-60', categoria: 'Distribución', moneda: 'ARS', sin_iva: base * 0.95, con_iva: base * 0.95 * 1.21, regla: '-5% sobre Contado' },
    { lista: 'Reventa 0/30/60', categoria: 'Reventa', moneda: 'ARS', sin_iva: base * 0.85, con_iva: base * 0.85 * 1.21, regla: '-15% sobre Contado' },
    { lista: 'Reventa Afiliado Contado (PSR/LTR BSAR)', categoria: 'Reventa afiliado', moneda: 'ARS', sin_iva: base * 0.8, con_iva: base * 0.8 * 1.21, regla: 'Precio fijo' },
    { lista: 'Afiliados empresas Contado (PSR/LTR BSAR)', categoria: 'Empresa afiliado', moneda: 'ARS', sin_iva: base * 0.82, con_iva: base * 0.82 * 1.21, regla: 'Precio fijo' }
  ];
  const principal = base => ({ lista: 'Contado', categoria: 'principal', moneda: 'ARS', sin_iva: base, con_iva: base * 1.21, regla: 'Precio fijo' });
  return { q, iva: 0.21, total: 2, limitado: false, productos: [
    { id: 1, nombre: '185/65R15 88H NEUMATICO DEMO A', codigo: 'DEMO-A', categoria: 'All / NEUMATICOS / PCR', stock_total: 9,
      stock: [{ deposito: 'Posadas', cantidad: 6 }, { deposito: 'Eldorado', cantidad: 3 }], principal: principal(120000), precios: precios(120000) },
    { id: 2, nombre: '185/60R15 84T NEUMATICO DEMO B', codigo: 'DEMO-B', categoria: 'All / NEUMATICOS / PCR', stock_total: 0,
      stock: [], principal: principal(105000), precios: precios(105000) }
  ] };
}

/* ---------- Búsqueda ---------- */
async function buscar(){
  const q = document.getElementById('q').value.trim();
  const err = document.getElementById('err'), status = document.getElementById('status');
  err.style.display = 'none';
  if(q.replace(/[^a-z0-9]/gi, '').length < 3){
    err.textContent = 'Escribí al menos 3 letras o números.'; err.style.display = 'block'; return;
  }
  const btn = document.getElementById('btnBuscar');
  btn.disabled = true; btn.textContent = 'Buscando…';
  status.textContent = 'Consultando Odoo…';
  document.getElementById('empty').style.display = 'none';
  try{
    data = DEMO ? demoData(q) : await api({ q });
    render();
  }catch(e){
    data = null;
    document.getElementById('results').innerHTML = '';
    status.textContent = '';
    err.textContent = e.message; err.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Buscar';
    document.getElementById('q').blur();
  }
}

/* ---------- Render ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function money(v, moneda){
  if(v == null) return '—';
  const sim = !moneda || moneda === 'ARS' ? '$' : moneda;
  return sim + ' ' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function render(){
  const res = document.getElementById('results'), status = document.getElementById('status');
  renderCats();
  if(!data) return;
  const soloStock = document.getElementById('soloStock').checked;
  const conIva = document.getElementById('conIva').checked;
  const lista = data.productos.filter(p => !soloStock || p.stock_total > 0);

  const conStock = data.productos.filter(p => p.stock_total > 0).length;
  status.textContent = `${data.total} producto${data.total === 1 ? '' : 's'} para "${data.q}", ${conStock} con stock` +
    (data.limitado ? '. Se muestran los primeros 50: afiná la búsqueda.' : '.');

  if(!lista.length){
    res.innerHTML = `<div class="empty">${data.total ? 'Ninguno tiene stock. Destildá "Solo con stock" para verlos.' : 'Sin resultados. Probá solo con la medida, por ejemplo 205 55 16.'}</div>`;
    return;
  }

  res.innerHTML = lista.map((p, i) => {
    const stockChips = p.stock.length
      ? p.stock.map(d => `<span class="chip">${esc(d.deposito)}: <b>${d.cantidad}</b></span>`).join('')
      : '<span class="chip">Sin stock en ningún depósito</span>';
    const visibles = p.precios.filter(pr => cat === 'Todas' || pr.categoria === cat);
    let grupo = null;
    const filas = visibles.map(pr => {
      let cab = '';
      if(cat === 'Todas' && pr.categoria !== grupo){
        grupo = pr.categoria;
        cab = `<tr class="grp"><td colspan="${conIva ? 3 : 2}">${esc(grupo)}</td></tr>`;
      }
      return cab + `
      <tr>
        <td class="lista"><b>${esc(pr.lista)}</b><small>${esc(pr.regla)}</small></td>
        <td class="num ${conIva ? '' : 'big'}">${money(pr.sin_iva, pr.moneda)}</td>
        ${conIva ? `<td class="num big">${money(pr.con_iva, pr.moneda)}</td>` : ''}
      </tr>`;
    }).join('') || `<tr><td colspan="${conIva ? 3 : 2}" class="lista"><small>Sin listas de ${esc(cat)} para este producto.</small></td></tr>`;
    const pr0 = p.principal;
    const principal = pr0 ? `
      <div class="principal">
        <span class="lbl">Contado</span>
        <span class="val">${money(conIva ? pr0.con_iva : pr0.sin_iva, pr0.moneda)}</span>
        <span class="alt">${conIva ? money(pr0.sin_iva, pr0.moneda) + ' sin IVA' : money(pr0.con_iva, pr0.moneda) + ' con IVA'}</span>
      </div>` : '';
    return `
      <details class="prod" ${i === 0 ? 'open' : ''}>
        <summary>
          <div class="pinfo">
            <div class="pname">${esc(p.nombre)}</div>
            <div class="pmeta">${esc(p.codigo)}${p.codigo && p.categoria ? ' · ' : ''}${esc(p.categoria.replace(/^All \/ /, ''))}</div>
            ${principal}
          </div>
          <div class="pstock ${p.stock_total > 0 ? '' : 'zero'}"><b>${p.stock_total}</b><small>en stock</small></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="pbody">
          <div class="sect">Stock disponible por depósito</div>
          <div class="chips">${stockChips}</div>
          <div class="sect">Precios por lista${cat === 'Todas' ? '' : ' · ' + esc(cat)}</div>
          <div class="tbl-wrap">
            <table>
              <thead><tr><th>Lista</th><th class="num">Sin IVA</th>${conIva ? `<th class="num">Con IVA ${Math.round((data.iva || 0) * 100)}%</th>` : ''}</tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>
      </details>`;
  }).join('') + `<p class="foot-note">Precios para 1 unidad, calculados con las reglas vigentes de cada lista. Stock disponible = cantidad menos lo reservado.</p>`;
}

renderCats();
if(DEMO) document.getElementById('demoBar').style.display = 'block';
document.getElementById('q').focus();
</script>
</body>
</html>
