<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultor de precios y stock – Top Neumáticos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1d1f; --ground:#f2f0eb; --card:#ffffff; --line:#d9d5cc; --field:#b8b3a8;
    --muted:#5b5750; --accent:#c2410c; --accent-dk:#9a3412; --live:#1d4ed8; --soft:#ece9e2;
    --display:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#dedad2;color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
  .app{max-width:760px;min-height:100vh;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
  header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 16px;position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:12px}
  .brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px}
  .sub{font-size:13px;color:#d6d3cc}
  .search{display:flex;gap:8px}
  .search input{flex:1;min-width:0;height:54px;border:none;border-radius:10px;padding:0 14px;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink)}
  .search input::placeholder{font-family:var(--body);font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:#8a857b}
  button{font-family:var(--body);cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn{border:none;border-radius:10px;font-size:15px;font-weight:600;min-height:54px;padding:0 20px;background:var(--accent);color:#fff}
  .btn:hover{background:var(--accent-dk)}
  input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--live);outline-offset:2px}
  .opts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#d6d3cc}
  .opts label{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
  .opts input{width:20px;height:20px;accent-color:var(--accent)}

  main{padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px}
  .status{font-size:14px;color:var(--muted);padding:0 4px}
  .err{background:#fff;border:2px solid var(--accent-dk);border-radius:12px;padding:14px 16px;color:var(--accent-dk);font-weight:600;font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;line-height:1.5}

  details.prod{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  details.prod[open]{border-color:var(--ink)}
  summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  summary::-webkit-details-marker{display:none}
  .pinfo{flex:1;min-width:0}
  .pname{font-size:16px;font-weight:600;line-height:1.3}
  .pmeta{font-size:12px;color:var(--muted);margin-top:4px}
  .pstock{text-align:right;flex-shrink:0}
  .pstock b{display:block;font-family:var(--display);font-size:28px;line-height:1}
  .pstock small{font-size:11px;color:var(--muted)}
  .pstock.zero b{color:var(--accent-dk)}
  .chev{width:20px;height:20px;flex-shrink:0;margin-top:2px;transition:transform .15s}
  details[open] .chev{transform:rotate(180deg)}

  .pbody{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
  .sect{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--soft);border-radius:20px;padding:6px 12px;font-size:13px}
  .chip b{font-weight:600}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.num,td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
  td.lista b{font-weight:600}
  td.lista small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  td.big{font-weight:600}
  tr:last-child td{border-bottom:none}
  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #5b5750;background:transparent;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
  .cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .principal{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .principal .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .principal .val{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent-dk);line-height:1}
  .principal .alt{font-size:12px;color:var(--muted)}
  tr.grp td{background:var(--soft);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px}
  .nivel{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;margin-top:6px}
  .nivel i{width:8px;height:8px;border-radius:4px;display:inline-block}
  .nivel.ok{background:#e3f1e6;color:#1d6b33}.nivel.ok i{background:#1d8a3e}
  .nivel.mod{background:#fbf0d9;color:#7a5200}.nivel.mod i{background:#d99a00}
  .nivel.crit{background:#fbe3dc;color:#9a3412}.nivel.crit i{background:#c2410c}
  .wa{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
  .wa-row{display:flex;gap:8px}
  .wa-row input{flex:1;min-width:0;height:48px;border:1px solid var(--field);border-radius:10px;padding:0 12px;font-size:16px;font-family:var(--body)}
  .btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:none;border-radius:10px;background:#1d7a45;color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
  .btn-wa:hover{background:#155e35}
  .wa-btns{display:flex;gap:8px;flex-wrap:wrap}
  .wa-btns > button{flex:1 1 200px}
  .btn-copy{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap}
  .btn-copy:hover{background:var(--soft)}
  .btn-copy.ok{background:#e3f1e6;border-color:#1d8a3e;color:#1d6b33}
  td.sel{width:40px;padding:6px 4px 6px 8px}
  td.sel input{width:22px;height:22px;accent-color:#1d7a45;cursor:pointer;display:block}
  tr.fila{cursor:pointer}
  tr.fila.on td{background:#e8f4ec}
  tr.contado td.lista b{color:var(--accent-dk)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .siniva{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
  .demo{background:var(--accent-dk);color:#fff;font-size:12px;text-align:center;padding:4px}
  .foot-note{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="demo" id="demoBar" style="display:none">Modo demo: sin conexión a Odoo</div>
  <header>
    <div>
      <div class="brand">TOP · Consultor de precios</div>
      <div class="sub">Precio por lista y stock por depósito, en vivo desde Odoo</div>
    </div>
    <div class="search">
      <input id="q" placeholder="Medida o nombre: 205 55 16, F600…" autocomplete="off" enterkeyhint="search" aria-label="Buscar producto" onkeydown="if(event.key==='Enter')buscar()">
      <button class="btn" id="btnBuscar" onclick="buscar()">Buscar</button>
    </div>
    <div class="cats" role="group" aria-label="Tipo de cliente" id="cats"></div>
    <div class="opts">
      <label><input type="checkbox" id="soloStock" onchange="render()"> Solo con stock</label>
      <label><input type="checkbox" id="conIva" checked onchange="render()"> Mostrar con IVA</label>
    </div>
  </header>

  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="err" id="err" style="display:none"></div>
    <div id="results"></div>
    <div class="empty" id="empty">Escribí una medida o parte del nombre y tocá Buscar.<br>Ejemplos: <b>205 55 16</b>, <b>175/70R13</b>, <b>F600</b>.</div>
  </main>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN
   WEBHOOK_URL vacío = modo demo (no llama a n8n).
   ===================================================================== */
const CONFIG = {
  WEBHOOK_URL: 'https://envy-recollect-last.ngrok-free.dev/webhook/consulta-precios',
  HEADER_NAME: 'X-CP-Key'     // mismo nombre que la credencial Header Auth del Webhook
};
const DEMO = !CONFIG.WEBHOOK_URL;

let data = null;
const CATS_BASE = ['Todas', 'Mostrador', 'Distribución', 'Reventa', 'Reventa afiliado', 'Empresa afiliado'];
let cat = 'Todas';
try { cat = localStorage.getItem('cp_cat') || 'Todas'; } catch(e){}

function renderCats(){
  const extra = data && data.productos.some(p => p.precios.some(x => x.categoria === 'Otras')) ? ['Otras'] : [];
  const lista = [...CATS_BASE, ...extra];
  if(!lista.includes(cat)) cat = 'Todas';
  document.getElementById('cats').innerHTML = lista.map(c =>
    `<button aria-pressed="${c === cat}" onclick="setCat('${c}')">${c}</button>`).join('');
}
const seleccion = new Set();   // claves "idProducto|lista" marcadas para enviar
function setCat(c){
  cat = c;
  seleccion.clear();
  try { localStorage.setItem('cp_cat', c); } catch(e){}
  renderCats(); render();
}

/* ---------- API ---------- */
function getKey(){
  let k = null;
  try { k = localStorage.getItem('cp_key'); } catch(e){}
  if(!k){
    k = window.prompt('Clave de acceso (la da el administrador):');
    if(!k) throw new Error('Falta la clave de acceso.');
    if(window.confirm('¿Recordar la clave en este dispositivo?')){ try{ localStorage.setItem('cp_key', k); }catch(e){} }
  }
  return k;
}
async function api(payload){
  const key = getKey();
  const r = await fetch(CONFIG.WEBHOOK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', [CONFIG.HEADER_NAME]: key, 'ngrok-skip-browser-warning': '1' },
    body: JSON.stringify(payload)
  });
  if(r.status === 401 || r.status === 403){ try{ localStorage.removeItem('cp_key'); }catch(e){} throw new Error('Clave incorrecta. Volvé a intentar.'); }
  const txt = await r.text();
  if(!r.ok) throw new Error('Error del servidor (' + r.status + '): ' + (txt || 'sin detalle') + '. Revisá Executions en n8n.');
  if(!txt) throw new Error('n8n respondió vacío. Revisá Executions en n8n.');
  try { return JSON.parse(txt); } catch(e){ throw new Error('Respuesta no válida de n8n: ' + txt.slice(0, 120)); }
}

function demoData(q){
  const fila = (lista, categoria, v) => ({ lista, categoria, moneda: 'ARS', sin_iva: v, con_iva: v * 1.21 });
  const precios = (b, afil) => [
    fila('MP 6 / Mi Pyme 6 C / Bco Ctes 6C', 'Mostrador', b * 1.12),
    fila('MP 12', 'Mostrador', b * 1.25),
    fila('0-30-60', 'Distribución', b * 0.95),
    fila('Proforma', 'Distribución', b * 0.97),
    fila('Reventa 0/30/60', 'Reventa', b * 0.85),
    fila('Proforma Reventa', 'Reventa', b * 0.83),
    ...(afil ? [fila('Reventa Afiliado Contado (PSR/LTR BSAR)', 'Reventa afiliado', b * 0.8),
                fila('Afiliados empresas Contado (PSR/LTR BSAR)', 'Empresa afiliado', b * 0.82)] : [])
  ];
  return { q, iva: 0.21, total: 2, limitado: false, productos: [
    { id: 1, nombre: '185/65R15 88H FIRESTONE F600 DEMO', codigo: 'DEMO-A', categoria: 'All / NEUMATICOS / PSR', marca: 'FIRESTONE', afiliable: true,
      stock_total: 26, stock: [{ deposito: 'Posadas', cantidad: 18 }, { deposito: 'Eldorado', cantidad: 8 }],
      principal: fila('Contado', 'principal', 120000), precios: precios(120000, true) },
    { id: 2, nombre: '185/65R15 88H HANKOOK K435 DEMO', codigo: 'DEMO-B', categoria: 'All / NEUMATICOS / PSR', marca: 'HANKOOK', afiliable: false,
      stock_total: 5, stock: [{ deposito: 'Posadas', cantidad: 5 }],
      principal: fila('Contado', 'principal', 98000), precios: precios(98000, false) }
  ] };
}

/* ---------- Búsqueda ---------- */
async function buscar(){
  const q = document.getElementById('q').value.trim();
  const err = document.getElementById('err'), status = document.getElementById('status');
  err.style.display = 'none';
  if(q.replace(/[^a-z0-9]/gi, '').length < 3){
    err.textContent = 'Escribí al menos 3 letras o números.'; err.style.display = 'block'; return;
  }
  const btn = document.getElementById('btnBuscar');
  btn.disabled = true; btn.textContent = 'Buscando…';
  status.textContent = 'Consultando Odoo…';
  document.getElementById('empty').style.display = 'none';
  try{
    data = DEMO ? demoData(q) : await api({ q });
    render();
  }catch(e){
    data = null;
    document.getElementById('results').innerHTML = '';
    status.textContent = '';
    err.textContent = e.message; err.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'Buscar';
    document.getElementById('q').blur();
  }
}

/* ---------- Render ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function money(v, moneda){
  if(v == null) return '—';
  const sim = !moneda || moneda === 'ARS' ? '$' : moneda;
  return sim + ' ' + Number(v).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* Semáforo de stock (suma de todos los depósitos) */
function nivelStock(total){
  // Emojis "clásicos" (\u2705, \u26A0, \u26D4): los círculos de color nuevos llegan como "?" en WhatsApp Web/escritorio
  if(total > 20) return { clase: 'ok',   texto: 'Disponible', emoji: '\u2705' };
  if(total >= 8) return { clase: 'mod',  texto: 'Moderado',   emoji: '\u26A0\uFE0F' };
  return               { clase: 'crit', texto: 'Crítico',    emoji: '\u26D4' };
}
// Listas que se muestran y se envían siempre SIN IVA (cualquier nombre que empiece con "Proforma")
const esSinIva = pr => /^proforma\b/i.test(String(pr.lista || '').trim());
const ES_AFILIADO = c => c === 'Reventa afiliado' || c === 'Empresa afiliado';
const preciosVisibles = p => p.precios.filter(pr => cat === 'Todas' || pr.categoria === cat);

function render(){
  const res = document.getElementById('results'), status = document.getElementById('status');
  renderCats();
  if(!data) return;
  const soloStock = document.getElementById('soloStock').checked;
  const conIva = document.getElementById('conIva').checked;

  // En listas de afiliados solo se muestran Bridgestone / Firestone / Dayton de categoría PSR o LTR
  const base = data.productos.filter(p => !ES_AFILIADO(cat) || p.afiliable);
  const lista = base.filter(p => !soloStock || p.stock_total > 0);

  const conStock = base.filter(p => p.stock_total > 0).length;
  status.textContent = `${base.length} producto${base.length === 1 ? '' : 's'} para "${data.q}"` +
    (ES_AFILIADO(cat) ? ' (solo Bridgestone, Firestone y Dayton PSR/LTR)' : '') +
    `, ${conStock} con stock` + (data.limitado ? '. Se muestran los primeros 50: afiná la búsqueda.' : '.');

  if(!lista.length){
    const msg = !base.length && ES_AFILIADO(cat) ? 'Ningún producto de la búsqueda aplica a listas de afiliados.'
      : base.length ? 'Ninguno tiene stock. Destildá "Solo con stock" para verlos.'
      : 'Sin resultados. Probá solo con la medida, por ejemplo 185 65 15.';
    res.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  const cols = conIva ? 3 : 4;
  const head = conIva
    ? `<th><span class="sr">Enviar</span></th><th>Condición</th><th class="num">Con IVA ${Math.round((data.iva || 0) * 100)}%</th>`
    : `<th><span class="sr">Enviar</span></th><th>Condición</th><th class="num">Sin IVA</th><th class="num">Con IVA</th>`;
  const filaPrecio = (p, pr, extraClase) => {
    const key = p.id + '|' + pr.lista;
    const on = seleccion.has(key);
    return `<tr class="fila ${extraClase || ''} ${on ? 'on' : ''}" onclick="toggleSel(event, ${p.id}, '${encodeURIComponent(pr.lista)}')">
      <td class="sel"><input type="checkbox" ${on ? 'checked' : ''} aria-label="Enviar ${esc(pr.lista)}" tabindex="0"></td>
      <td class="lista"><b>${esc(pr.lista)}</b></td>` +
      (esSinIva(pr)
        ? (conIva ? `<td class="num big">${money(pr.sin_iva, pr.moneda)} <small class="siniva">+ IVA</small></td>`
                  : `<td class="num big">${money(pr.sin_iva, pr.moneda)}</td><td class="num"><small class="siniva">—</small></td>`)
        : (conIva ? `<td class="num big">${money(pr.con_iva, pr.moneda)}</td>`
                  : `<td class="num">${money(pr.sin_iva, pr.moneda)}</td><td class="num big">${money(pr.con_iva, pr.moneda)}</td>`)) +
      `</tr>`;
  };

  res.innerHTML = lista.map((p, i) => {
    const nv = nivelStock(p.stock_total);
    const stockChips = p.stock.length
      ? p.stock.map(d => `<span class="chip">${esc(d.deposito)}: <b>${d.cantidad}</b></span>`).join('')
      : '<span class="chip">Sin stock en ningún depósito</span>';

    let grupo = null;
    const filasListas = preciosVisibles(p).map(pr => {
      let cab = '';
      if(cat === 'Todas' && pr.categoria !== grupo){
        grupo = pr.categoria;
        cab = `<tr class="grp"><td colspan="${cols}">${esc(grupo)}</td></tr>`;
      }
      return cab + filaPrecio(p, pr);
    }).join('');
    const filas = (p.principal ? filaPrecio(p, p.principal, 'contado') : '') +
      (filasListas || `<tr><td colspan="${cols}" class="lista"><small>Sin listas de ${esc(cat)} para este producto.</small></td></tr>`);
    const nSel = [...seleccion].filter(k => k.startsWith(p.id + '|')).length;

    const pr0 = p.principal;
    const principal = pr0 ? `
      <div class="principal">
        <span class="lbl">Contado</span>
        <span class="val">${money(pr0.con_iva, pr0.moneda)}</span>
        ${conIva ? '<span class="alt">con IVA</span>' : `<span class="alt">con IVA · ${money(pr0.sin_iva, pr0.moneda)} sin IVA</span>`}
      </div>` : '';

    return `
      <details class="prod" ${i === 0 ? 'open' : ''}>
        <summary>
          <div class="pinfo">
            <div class="pname">${esc(p.nombre)}</div>
            <div class="pmeta">${esc(p.codigo)}${p.marca ? ' · ' + esc(p.marca) : ''}${p.categoria ? ' · ' + esc(p.categoria.replace(/^All \/ /, '')) : ''}</div>
            ${principal}
            <span class="nivel ${nv.clase}"><i></i>Stock ${nv.texto}</span>
          </div>
          <div class="pstock ${p.stock_total > 0 ? '' : 'zero'}"><b>${p.stock_total}</b><small>en stock</small></div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="pbody">
          <div class="sect">Stock disponible por depósito</div>
          <div class="chips">${stockChips}</div>
          <div class="sect">Precios por condición${cat === 'Todas' ? '' : ' · ' + esc(cat)}</div>
          <div class="tbl-wrap">
            <table>
              <thead><tr>${head}</tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
          <div class="wa">
            <div class="wa-btns">
            <button class="btn-copy" id="copy_${p.id}" onclick="copiar(${p.id})" ${nSel ? '' : 'disabled'}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copiar mensaje</span>
            </button>
            <button class="btn-wa" onclick="compartir(${p.id})" ${nSel ? '' : 'disabled'}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.1.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
              ${nSel ? `Enviar ${nSel} precio${nSel === 1 ? '' : 's'} por WhatsApp` : 'Marcá los precios a enviar'}
            </button>
            </div>
          </div>
        </div>
      </details>`;
  }).join('') + `<p class="foot-note">Precios para 1 unidad. Stock disponible = cantidad menos lo reservado. Semáforo: más de 20 disponible, de 8 a 20 moderado, menos de 8 crítico.</p>`;
}

/* ---------- Selección y WhatsApp ---------- */
function toggleSel(ev, id, listaEnc){
  const key = id + '|' + decodeURIComponent(listaEnc);
  if(seleccion.has(key)) seleccion.delete(key); else seleccion.add(key);
  const abiertos = [...document.querySelectorAll('details.prod')].map(d => d.open);
  render();
  document.querySelectorAll('details.prod').forEach((d, i) => { d.open = !!abiertos[i]; });
}
function armarMensaje(id){
  const p = data.productos.find(x => x.id === id);
  if(!p) return null;
  const elegidos = [p.principal, ...p.precios].filter(pr => pr && seleccion.has(p.id + '|' + pr.lista));
  if(!elegidos.length) return null;
  const nv = nivelStock(p.stock_total);
  const l = [];
  l.push(`*${p.nombre}*`);
  l.push(`Código: ${p.codigo || '-'}`);
  if(p.marca) l.push(`Marca: ${p.marca}`);
  l.push(`Stock: ${nv.emoji} ${nv.texto}`);
  l.push('');
  l.push(elegidos.every(esSinIva) ? '*Precio sin IVA*' : elegidos.some(esSinIva) ? '*Precios*' : '*Precio con IVA*');
  const mixto = elegidos.some(esSinIva) && !elegidos.every(esSinIva);
  elegidos.forEach(pr => l.push(esSinIva(pr)
    ? `• ${pr.lista}: ${money(pr.sin_iva, pr.moneda)}${mixto ? ' + IVA' : ''}`
    : `• ${pr.lista}: ${money(pr.con_iva, pr.moneda)}${mixto ? ' (IVA incluido)' : ''}`));
  l.push('');
  l.push('_Precios sujetos a modificación sin previo aviso._');
  return l.join('\n');
}
function compartir(id){
  const msg = armarMensaje(id);
  if(msg) window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
}

/* Copia sin mostrar el texto. Usa el portapapeles moderno y, si no está disponible, un textarea oculto. */
async function copiarTexto(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
const timersCopia = {};
async function copiar(id){
  const msg = armarMensaje(id);
  if(!msg) return;
  const btn = document.getElementById('copy_' + id);
  const lbl = btn.querySelector('span');
  const ok = await copiarTexto(msg);
  btn.classList.toggle('ok', ok);
  lbl.textContent = ok ? 'Mensaje copiado' : 'No se pudo copiar';
  clearTimeout(timersCopia[id]);
  timersCopia[id] = setTimeout(() => { btn.classList.remove('ok'); lbl.textContent = 'Copiar mensaje'; }, 2500);
}

renderCats();
if(DEMO) document.getElementById('demoBar').style.display = 'block';
document.getElementById('q').focus();
